name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify
        run: npm run check

  browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Upload visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-checks
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
